name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère le dossier android/ s'il n'a pas encore été ajouté au dépôt
      - name: Préparer le projet Android
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name carnet_dettes --org com.carnetdettes --platforms android
            MANIFEST=android/app/src/main/AndroidManifest.xml
            sed -i 's/android:label="carnet_dettes"/android:label="Carnet de Dettes"/' "$MANIFEST"
            # Autorise l'ouverture du téléphone et de WhatsApp (Android 11+)
            sed -i 's|<queries>|<queries>\n        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>|' "$MANIFEST"
          fi

      - run: flutter pub get

      - run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk carnet-dettes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carnet-dettes-apk
          path: carnet-dettes.apk

      - name: Publier une Release (sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: carnet-dettes.apk

      # À chaque mise à jour de main : nouvelle Release avec l'APK
      - name: Publier une Release automatique
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carnet de Dettes v1.0.${{ github.run_number }}
          body: "📱 Téléchargez **carnet-dettes.apk** ci-dessous et installez-le sur votre téléphone Android."
          make_latest: true
          files: carnet-dettes.apk
