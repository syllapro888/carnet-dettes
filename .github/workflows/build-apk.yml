name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version figée : celle de la dernière construction réussie (v1.0.5).
          # La 3.50.0 fait planter la construction Android (image_picker).
          flutter-version: 3.47.9
          cache: true

      # Génère le dossier android/ s'il n'est pas dans le dépôt
      - name: Préparer le projet Android
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name carnet_dettes --org com.carnetdettes --platforms android
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="carnet_dettes"/android:label="Carnet de Dettes"/' "$MANIFEST"
          # Internet (vérification des mises à jour)
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          # Ouverture du téléphone et de WhatsApp (Android 11+)
          grep -q 'android.intent.action.DIAL' "$MANIFEST" || \
            sed -i 's|<queries>|<queries>\n        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>|' "$MANIFEST"

      # Toujours la même clé de signature : les mises à jour s'installent
      # par-dessus l'ancienne version sans perdre les données.
      - name: Installer la clé de signature
        run: |
          mkdir -p ~/.android
          cp signing/release.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Générer l'icône de l'application
        run: dart run flutter_launcher_icons

      - run: flutter test

      - name: Construire l'APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk carnet-dettes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carnet-dettes-apk
          path: carnet-dettes.apk

      # À chaque mise à jour de main : nouvelle Release avec l'APK.
      # L'application installée la détecte et propose la mise à jour.
      - name: Publier la Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carnet de Dettes v1.0.${{ github.run_number }}
          body: "📱 Téléchargez **carnet-dettes.apk** ci-dessous et installez-le sur votre téléphone Android."
          make_latest: true
          files: carnet-dettes.apk
